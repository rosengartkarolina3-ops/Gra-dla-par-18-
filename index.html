function intro(){return `<section class="panel age"><span class="tag">Wyłącznie 18+</span><h2>Witaj w Namiętnych Wyzwaniach</h2><p>To gra przeznaczona wyłącznie dla osób pełnoletnich. Każde zadanie jest dobrowolne. Możesz odmówić w każdej chwili — bez konsekwencji i bez utraty punktów.</p><label class="check"><input type="checkbox" id="ageCheck">Potwierdzam, że mam ukończone 18 lat i rozumiem zasady zgody.</label><div class="buttons"><button id="enter">Przejdź do gry</button></div></section>`;}

function configure(){
 const people=s.players.map((p,i)=>{
  const groupFields=s.twoPlayer?`<div style="margin-top:7px"><label>Płeć uczestnika na potrzeby finału</label><select data-gender="${i}"><option value="K" ${p.gender==='K'?'selected':''}>Kobieta</option><option value="M" ${p.gender==='M'?'selected':''}>Mężczyzna</option></select></div>`:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px"><select data-gender="${i}"><option value="K" ${p.gender==='K'?'selected':''}>Kobiety</option><option value="M" ${p.gender==='M'?'selected':''}>Mężczyźni</option></select><select data-pair="${i}">${Array.from({length:s.players.length/2},(_,k)=>`<option value="${k}" ${p.pair===k?'selected':''}>Para ${k+1}</option>`).join('')}</select></div>`;
  return `<div class="player"><label>${s.twoPlayer?'Osoba':'Gracz'} ${i+1}</label><input maxlength="35" data-name="${i}" value="${esc(p.name)}">${groupFields}</div>`;
 }).join('');
 return `<section class="panel"><h2>Wybierz liczbę graczy</h2><p class="hint">Jedna przeglądarka, jedna wspólna rozgrywka. Wariant we dwoje lub 4–10 graczy.</p>
 <div class="tabs"><button id="selectDuo" class="${s.twoPlayer?'active':''}">We dwoje (2)</button><button id="selectGroup" class="${!s.twoPlayer?'active':''}">Grupa (4–10)</button></div>
 <div class="grid" style="margin-top:14px">${people}</div>
 ${s.twoPlayer?'':`<div class="buttons"><button class="secondary" id="less" ${s.players.length<=4?'disabled':''}>− Usuń 2 osoby</button><button class="secondary" id="more" ${s.players.length>=10?'disabled':''}>+ Dodaj 2 osoby</button></div>`}
 <div class="hr"></div>
 <p class="hint">${s.twoPlayer?'W duecie punktacja jest osobna dla obu osób. Karty dla pary wymagają zgody obojga.':'Tryby Kobiety kontra Mężczyźni oraz Para kontra Para mają oddzielne rankingi.'}</p>
 <label class="check"><input id="contact" type="checkbox" ${s.contact?'checked':''}>Dopuszczamy opcjonalny kontakt fizyczny — każdy raz wymaga odrębnej zgody.</label>
 <div class="buttons"><button id="begin">Rozpocznij grę</button></div>
 <p class="small">18+ · każde zadanie można pominąć bez kary · dane zapisują się tylko lokalnie.</p></section>`;
}

function stageHTML(){let prog=Array.from({length:10},(_,i)=>`<span class="${s.level===i+1?'on':''}">${i===9?'Finał':i+1}</span>`).join('');return `<div class="progress" aria-label="Postęp poziomów">${prog}</div><div class="row space"><span class="level">${s.level===10?`Finał Główny · etap ${Math.min(s.stage+1,5)}/5`:`Poziom ${s.level}/9`}</span><span class="small">${s.mode==='duet'?'Gra we dwoje':s.mode==='gender'?'Kobiety kontra Mężczyźni':'Para kontra Para'}</span></div>`;}
function game(){const deck=s.level===10&&s.finaleWinner?finalCards():s.deck[s.level]||[];const card=s.card&&deck.find(x=>x.id===s.card);const left=deck.filter(c=>!s.used.includes(c.id)).length;
let content='';if(s.level===10&&!s.finaleWinner){const preferred=finalSuggestion();content=`<div class="hero"><span class="tag">Finał Główny 18+</span><h2>Kto wygrał rywalizację?</h2><p>Wybierz ścieżkę pięciu etapów. Zadania wykona przegrana osoba lub przegrana drużyna, jeśli dobrowolnie się zgodzi. Remis można rozstrzygnąć wspólnym wyborem.</p>${preferred?'<p class="hint">Na podstawie dostępnych wyników prowadzi: '+(preferred==='K'?'kobieta':'mężczyzna')+'.</p>':''}<div class="buttons"><button id="finalWoman">Wygrała kobieta</button><button id="finalMan">Wygrał mężczyzna</button></div><p class="small">Obie wersje mają własne karty w edytorze. Każde wyzwanie można odrzucić bez kary.</p></div>`;}else if(s.ready){content=`<div class="hero"><span class="tag">Etap ukończony</span><h2>${s.level===10?'Finał ukończony!':`Poziom ${s.level} ukończony`}</h2><p>${s.level===10?'Finał zakończony. Wszystkie 5 etapów zostało rozpatrzonych.':'Możecie przejść dalej, gdy wszyscy będą gotowi.'}</p><div class="buttons">${s.level<10?`<button id="nextLevel">Przejdź do ${s.level===9?'finału':`poziomu ${s.level+1}`}</button>`:'<button id="newGame">Nowa rozgrywka</button>'}</div></div>`;}
else if(!card){content=`<div class="hero"><span class="tag">${s.level===10?'Wyzwanie finałowe':'Talia wyzwań'}</span><h2>${s.level===10?`Etap ${s.stage+1} z 5`:left?`Gotowi na kolejną kartę?`:'Koniec talii'}</h2><p class="hint">${s.level===10?'Pięć etapów dla przegranej strony ma ustaloną kolejność.':'W tej rozgrywce każda karta pojawia się tylko raz.'}</p><div class="buttons"><button id="draw">${s.level===10?'Otwórz kartę finałową':'Losuj kartę'}</button>${s.level<10?'<button class="secondary" id="completeLevel">Zakończ poziom</button>':''}</div></div>`;}
else {const targets=s.targets.map(i=>({i,p:s.players[i]}));const allAccepted=targets.length>0&&targets.every(({i})=>s.accept.includes(i));const allConfirmed=targets.length>0&&targets.every(({i})=>s.confirm.includes(i));const done=allAccepted&&allConfirmed;
content=`<div class="hero"><span class="tag">${esc(card.id)} · ${card.points} pkt za wykonawcę</span><h2>${esc(card.title)}</h2><div class="challenge">${esc(card.text)}</div><p class="hint">Wykonawcy: ${targets.map(({p})=>esc(p.name)).join(' i ')}</p></div><section class="panel"><h3>Zgoda i wykonanie</h3><p class="hint">Każda wskazana osoba osobno akceptuje albo pomija. Dopiero po potwierdzeniu przez wszystkich można przyznać punkty.</p>${targets.map(({i,p})=>`<div class="consent"><b>${esc(p.name)}</b><div class="buttons"><button class="${s.accept.includes(i)?'good':'secondary'}" data-accept="${i}" ${s.confirm.includes(i)?'disabled':''}>${s.accept.includes(i)?'✓ Zaakceptowano':'Akceptuję'}</button><button class="${s.confirm.includes(i)?'good':'secondary'}" data-confirm="${i}" ${!s.accept.includes(i)?'disabled':''}>${s.confirm.includes(i)?'✓ Wykonano':'Potwierdzam wykonanie'}</button></div></div>`).join('')}<div class="buttons"><button id="award" ${!done?'disabled':''}>${s.level===10?"Zatwierdź etap i dalej":"Przyznaj punkty i dalej"}</button><button class="ghost" id="skip">Pomiń bez kary</button></div></section>`;}
return `<div class="split"><div><section class="panel">${stageHTML()}</section>${content}<section class="panel"><h3>Granice i bezpieczeństwo</h3><p class="hint">W dowolnym momencie można przerwać grę, pominąć zadanie lub wycofać zgodę. Każdy uczestnik ma prawo powiedzieć „STOP”.</p><label class="check"><input id="contactInGame" type="checkbox" ${s.contact?'checked':''}>Kontakt fizyczny dopuszczony (z osobną zgodą)</label><div class="buttons"><button class="danger" id="stop">STOP — przerwij kartę</button></div></section></div><div><section class="panel"><h2>Wyniki</h2>${s.twoPlayer?'<p class="hint">Osobne punkty dla każdej osoby.</p>':`<div class="tabs"><button data-mode="gender" class="${s.mode==='gender'?'active':''}">Kobiety vs Mężczyźni</button><button data-mode="pairs" class="${s.mode==='pairs'?'active':''}">Para vs Para</button></div>`}${scoresHTML()}${s.twoPlayer?'':'<p class="small">Rankingi obu trybów są prowadzone osobno.</p>'}</section><section class="panel"><h3>Sesja</h3><p class="hint">Pozostało kart na poziomie: ${left}. Gracze: ${s.players.length}. Przebieg zapisany na tym urządzeniu.</p><div class="buttons"><button class="ghost" id="editOpen">Edytuj talie i finał</button><button class="ghost" id="tutorial">Instrukcja</button></div></section></div></div>`;}
function editor(){let all=Object.keys(s.deck).filter(level=>level!=='10').map(level=>`<details ${Number(level)===10?'open':''}><summary>${Number(level)===10?'Poziom 10 — Finał Główny (5 etapów)':`Poziom ${level}`} (${s.deck[level].length} kart)</summary><div class="cards-list">${s.deck[level].map(c=>`<div class="editcard"><div><b>${esc(c.id)} · ${esc(c.title)}</b><p class="small">${esc(c.text).slice(0,120)} · ${c.points} pkt</p></div><button class="secondary" data-edit="${esc(level)}|${esc(c.id)}">Edytuj</button></div>`).join('')}</div>${Number(level)<10?`<div class="buttons"><button class="ghost" data-add="${level}">Dodaj kartę</button></div>`:''}</details>`).join('');const finalsEditor=Object.entries(s.finaleVariants).map(([gender,cards])=>`<details open><summary>Finał — ${gender==='K'?'wygrywa kobieta':'wygrywa mężczyzna'} (${cards.length} etapów)</summary><div class="cards-list">${cards.map(c=>`<div class="editcard"><div><b>${esc(c.id)} · ${esc(c.title)}</b><p class="small">${esc(c.text).slice(0,120)}</p></div><button class="secondary" data-final-edit="${gender}|${esc(c.id)}">Edytuj</button></div>`).join('')}</div></details>`).join('');return `<section class="panel"><div class="row space"><h2>Edytor kart</h2><button class="secondary" id="editClose">Powrót</button></div><p class="hint">Zmiany są zapisywane na tym telefonie. Finał Główny zawiera dwie osobne wersje po pięć edytowalnych etapów. Nie edytuj aktualnej karty podczas jej wykonywania.</p>${all}${finalsEditor}</section>`;}
let view='game';
function render(){const root=$('app');if(!s.age)root.innerHTML=intro();else if(!s.started)root.innerHTML=configure();else if(view==='edit')root.innerHTML=editor();else root.innerHTML=game();attach();}
function readNames(){s.players.forEach((p,i)=>{const name=document.querySelector(`[data-name="${i}"]`);const gen=document.querySelector(`[data-gender="${i}"]`);const pair=document.querySelector(`[data-pair="${i}"]`);if(name)p.name=name.value.trim().slice(0,35)||`Gracz ${i+1}`;if(gen)p.gender=gen.value;if(pair)p.pair=Number(pair.value);});}
function choose(){if(s.level===10){const c=finalCards()[s.stage];if(!c){s.ready=true;return;}return c;}const available=s.deck[s.level].filter(c=>!s.used.includes(c.id));if(!available.length){s.ready=true;return;}return available[Math.floor(Math.random()*available.length)];}
function takeCard(){const c=choose();if(!c)return;let a=s.turn%s.players.length;s.turn++;let targets=s.level===10?finalLosers():[a];if(s.level!==10&&c.type==='duo'){if(s.twoPlayer)targets=[0,1];else{const p=s.players[a];const mate=s.players.findIndex((x,i)=>i!==a&&x.pair===p.pair);if(mate!==-1)targets.push(mate);}}s.card=c.id;s.targets=targets;s.accept=[];s.confirm=[];}
function clearCard(award){const card=(s.level===10?finalCards():s.deck[s.level]).find(c=>c.id===s.card);if(!card)return;if(award&&s.level!==10){const sc=activeScores();for(const i of s.targets){const k=teamKey(s.players[i]);sc[k]=(sc[k]||0)+card.points;}}s.history.push({level:s.level,card:card.id,accepted:award,mode:s.mode,at:new Date().toISOString()});s.used.push(card.id);s.card=null;s.accept=[];s.confirm=[];s.targets=[];if(s.level===10){s.stage++;if(s.stage>=5)s.ready=true;}else if(s.deck[s.level].every(c=>s.used.includes(c.id))){s.ready=true;}}
function startNext(){if(s.level>=10){s.level=1;s.stage=0;s.finaleWinner=null;s.used=[];s.scores={gender:{K:0,M:0},pairs:{},duet:{'0':0,'1':0}};s.history=[];}else{s.level++;s.stage=0;if(s.level===10)s.finaleWinner=null;}s.card=null;s.targets=[];s.accept=[];s.confirm=[];s.ready=false;}
function bind(id,fn){if($(id))$(id).addEventListener('click',fn);}
function attach(){
 bind('enter',()=>{if(!$('ageCheck').checked)return alert('Potwierdź pełnoletność i zasady zgody.');commit(()=>{s.age=true;});});
 bind('selectDuo',()=>commit(()=>{readNames();s.twoPlayer=true;s.players=s.players.slice(0,2);s.players.forEach(p=>p.pair=0);s.mode='duet';}));
 bind('selectGroup',()=>commit(()=>{readNames();s.twoPlayer=false;if(s.players.length<4){s.players.push({name:'Gracz 3',gender:'K',pair:1},{name:'Gracz 4',gender:'M',pair:1});}s.players.forEach((p,i)=>p.pair=Math.floor(i/2));s.mode='gender';}));
 bind('more',()=>commit(()=>{readNames();if(s.players.length<=8){let pair=s.players.length/2;s.players.push({name:`Gracz ${s.players.length+1}`,gender:'K',pair},{name:`Gracz ${s.players.length+2}`,gender:'M',pair});}}));
 bind('less',()=>commit(()=>{readNames();if(s.players.length>4)s.players.splice(-2);s.players.forEach(p=>p.pair=Math.min(p.pair,s.players.length/2-1));}));
 bind('begin',()=>{readNames();if(s.twoPlayer){if(s.players.length!==2)return alert('Tryb we dwoje wymaga 2 osób.');s.mode='duet';}else{if(s.players.length<4||s.players.length>10)return alert('Wybierz od 4 do 10 uczestników.');if(!s.players.some(p=>p.gender==='K')||!s.players.some(p=>p.gender==='M'))return alert('Tryb Kobiety kontra Mężczyźni wymaga obu drużyn.');if(!s.players.every(p=>s.players.filter(x=>x.pair===p.pair).length===2))return alert('Każda para musi mieć dokładnie 2 osoby.');}commit(()=>{s.contact=$('contact').checked;s.started=true;});});
 bind('finalWoman',()=>commit(()=>{if(!s.players.some(p=>p.gender==='K')||!finalLosersFor('K').length)return alert('Potrzebna jest kobieta i mężczyzna w rozgrywce.');s.finaleWinner='K';s.stage=0;}));
 bind('finalMan',()=>commit(()=>{if(!s.players.some(p=>p.gender==='M')||!finalLosersFor('M').length)return alert('Potrzebna jest kobieta i mężczyzna w rozgrywce.');s.finaleWinner='M';s.stage=0;}));
 bind('draw',()=>commit(()=>takeCard()));bind('completeLevel',()=>commit(()=>{s.ready=true;}));bind('nextLevel',()=>commit(()=>startNext()));bind('newGame',()=>{if(confirm('Rozpocząć od początku? Punkty i historia tej rozgrywki zostaną wyzerowane; talie zostaną zachowane.'))commit(()=>startNext());});
 bind('award',()=>commit(()=>clearCard(true)));bind('skip',()=>commit(()=>clearCard(false)));bind('stop',()=>commit(()=>{if(s.card)clearCard(false);else s.ready=true;}));
 bind('contactInGame',()=>{});if($('contactInGame'))$('contactInGame').addEventListener('change',e=>commit(()=>{s.contact=e.target.checked;}));
 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(s.twoPlayer)return;if(s.card)return alert('Zmień tryb dopiero po ukończeniu bieżącej karty.');commit(()=>{s.mode=b.dataset.mode;});}));
 document.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>commit(()=>{const i=Number(b.dataset.accept);if(!s.accept.includes(i))s.accept.push(i);else s.accept=s.accept.filter(v=>v!==i);})));
 document.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click',()=>commit(()=>{const i=Number(b.dataset.confirm);if(s.accept.includes(i)&&!s.confirm.includes(i))s.confirm.push(i);})));
 bind('editOpen',()=>{if(s.card)return alert('Najpierw ukończ bieżącą kartę.');view='edit';render();});bind('editClose',()=>{view='game';render();});
 document.querySelectorAll('[data-final-edit]').forEach(b=>b.addEventListener('click',()=>{const [gender,id]=b.dataset.finalEdit.split('|');const c=s.finaleVariants[gender].find(x=>x.id===id);const title=prompt('Tytuł etapu:',c.title);if(title===null)return;const body=prompt('Treść zadania przegranej osoby:',c.text);if(body===null)return;if(!title.trim()||!body.trim())return alert('Wpisz tytuł i treść.');commit(()=>{c.title=title.trim().slice(0,80);c.text=body.trim().slice(0,700);});}));
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{const [lvl,id]=b.dataset.edit.split('|');const c=s.deck[lvl].find(x=>x.id===id);const title=prompt('Nazwa karty:',c.title);if(title===null)return;const body=prompt('Tekst wyzwania:',c.text);if(body===null)return;const pts=prompt('Punkty za jednego wykonawcę (0–100):',String(c.points));if(pts===null)return;const kind=prompt('Typ karty: solo lub duo',c.type);if(kind===null)return;if(!['solo','duo'].includes(kind.trim()))return alert('Wybierz solo lub duo.');const n=Number(pts);if(!title.trim()||!body.trim()||!Number.isInteger(n)||n<0||n>100)return alert('Wpisz tytuł, treść i punkty od 0 do 100.');commit(()=>{c.title=title.trim().slice(0,80);c.text=body.trim().slice(0,700);c.points=n;c.type=kind.trim();});}));
 document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const lvl=b.dataset.add;const title=prompt('Nazwa nowej karty:');if(!title?.trim())return;const body=prompt('Wyzwanie:');if(!body?.trim())return;const kind=prompt('Wykonanie solo czy duo?','duo');if(kind===null)return;if(!['solo','duo'].includes(kind.trim()))return alert('Wybierz solo lub duo.');commit(()=>{s.deck[lvl].push({id:`L${lvl}-${Date.now().toString(36)}`,title:title.trim().slice(0,80),text:body.trim().slice(0,700),points:Number(lvl)>=8?75:50,type:kind.trim()});});}));
 bind('tutorial',()=>alert('ZASADY GRY\n\n1. Wybierz tryb dla 2 osób lub dla 4–10 osób. W grupie przypisz po dwie osoby do każdej pary.\n2. W duecie każda osoba zbiera swoje punkty. W grupie przełączaj dwa tryby rywalizacji; mają niezależne wyniki.\n3. Losuj karty bez powtórek.\n4. Każdy wykonawca może zaakceptować zadanie lub pominąć je bez kary. Punkty są naliczane dopiero po indywidualnym potwierdzeniu wykonania.\n5. Po 9 poziomach przejdź do 5-etapowego Finału Głównego.\n6. Finał Główny ma osobno 5 etapów wygranej kobiety lub mężczyzny. Zadania przypisane są stronie przegranej.\n7. Edytuj i zapisuj talie na tym urządzeniu.\n\nTa wersja jest lokalna — nie synchronizuje telefonów.'));
}
render();
</script></body></html>
